<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="meta-tema">
<title>AgroStake</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1a10">
<link rel="icon" href="/static/icono-192.png">
<link rel="apple-touch-icon" href="/static/icono-192.png">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
:root{
 --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--txt:#fff;--sec:#a1a1a8;--ter:#7c7c82;
 --txt2:#e5e5ea;--txt3:#d1d1d6;--sep:#2c2c2e;--grid:#2c2c2e;--grid2:#48484a;--chev:#c7c7cc;--sel:#636366;--segbg:#2c2c2e;
 --sw-off:#39393d;--tabbar:rgba(44,44,46,.74);--tab-borde:#ffffff14;--tab-act:#ffffff14;--hoja:#151516;--tip:#2c2c2e;
 --nota-bg:#ffd60a1a;--nota-txt:#ffe58a;--attr:#000a;--hover:#ffffff12;--on-lima:#000;--acento:#c6f432;--btn2:#2c2c2e;--campo:#2c2c2e;
 --suelo:#ff7a45;--agua:#32c8ff;--clima:#a8f04a;--lluvia:#3fb7f7;--evap:#ffd60a;--temp:#ff9f0a;--hum:#64d2ff;
 --verde:#30d158;--amarillo:#ffd60a;--rojo:#ff453a;--lima:#c6f432;--morado:#a59bf5;
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
[data-tema=claro]{
 --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--card3:#e5e5ea;--txt:#000;--sec:#5f5f66;--ter:#83838a;
 --txt2:#2c2c2e;--txt3:#3a3a3c;--sep:#e5e5ea;--grid:#e5e5ea;--grid2:#d1d1d6;--chev:#8e8e93;--sel:#fff;--segbg:#e5e5ea;
 --sw-off:#e3e3e8;--tabbar:rgba(255,255,255,.82);--tab-borde:#0000000f;--tab-act:#0000000d;--hoja:#f2f2f7;--tip:#fff;
 --nota-bg:#ffd60a38;--nota-txt:#5c4500;--attr:#fffc;--hover:#0000000a;--on-lima:#fff;--acento:#b9ec2a;--btn2:#e5e5ea;--campo:#f2f2f7;
 --suelo:#f0612a;--agua:#0a9fd8;--clima:#4caf2a;--lluvia:#007aff;--evap:#c99300;--temp:#e67e00;--hum:#0096c7;
 --verde:#28a745;--amarillo:#c99300;--rojo:#ff3b30;--lima:#5b9a00;--morado:#6e5ff0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--agua);outline-offset:2px;border-radius:10px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 150px}
@media(min-width:900px){.con-barra{padding-left:250px}.con-barra .wrap{padding-bottom:60px}}

/* ---------- Cabecera ---------- */
.fecha{font-size:14px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;margin:10px 4px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 10px}
.top h1{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(160deg,#a3add0,#5b678f);display:grid;place-items:center;font:600 18px var(--num);color:#fff;box-shadow:inset 0 1px 0 #ffffff50;flex:none}
.zona-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:9px 15px;font-size:16px;color:var(--sec);margin:0 0 14px 2px}
.zona-pill b{color:var(--txt);font-weight:600}
.intro-tab{color:var(--sec);font-size:17px;margin:-6px 4px 14px}

/* ---------- Rejilla de tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c2,.c4{grid-column:span 2}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.c4{grid-column:span 4}}
.card{background:var(--card);border-radius:22px;padding:16px;position:relative;min-width:0;display:block;width:100%}
.enlace{cursor:pointer;transition:transform .15s;display:flex;flex-direction:column}
.enlace:active{transform:scale(.98)}
.card h2{font-size:20px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em;padding-right:44px;line-height:1.25}
.card.con-chev h2{padding-right:80px}
.card h3{font-size:18px;font-weight:600;margin:16px 0 8px}
.chev{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--card3);display:grid;place-items:center}
.chev::before{content:"";width:7px;height:7px;border-right:2.5px solid var(--chev);border-top:2.5px solid var(--chev);transform:translateX(-1px) rotate(45deg)}
.leer{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--txt2);z-index:2}
.leer svg{width:18px;height:18px}.leer.hablando{background:var(--acento);color:#000}
.con-chev .leer{right:50px}
@media(max-width:520px){.enlace .chev{display:none}.enlace.con-chev h2{padding-right:36px}.enlace h2{font-size:17.5px}.leer{width:31px;height:31px}.con-chev .leer{right:12px}}
.lbl{font-size:17px;color:var(--txt2)}
.big{font-size:38px;line-height:1.05;margin:2px 0 8px;display:block}
.big small,.mid small{font-size:.55em;margin-left:3px;font-weight:600}
.mid{font-size:32px;line-height:1.1;display:block}
.sub{color:var(--sec);font-size:16px;margin:0}
.pie{color:var(--ter);font-size:15px;margin:14px 4px 0}
.anim>*{animation:sube .45s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}
.anim>*:nth-child(5){animation-delay:.16s}.anim>*:nth-child(6){animation-delay:.2s}.anim>*:nth-child(n+7){animation-delay:.24s}
@keyframes sube{from{opacity:0;transform:translateY(10px)}}
.dibuja .arc{animation:dib 1s cubic-bezier(.3,.7,.2,1) both}
@keyframes dib{from{stroke-dasharray:0 2000}}
.gl{stroke:var(--grid)}.gl2{stroke:var(--grid2)}.gt{fill:var(--sec)}.gs{fill:var(--txt)}
.hit{cursor:pointer;fill:transparent}.hit:hover,.hit.tip-on{fill:var(--hover)}
.barra{cursor:pointer;transition:opacity .15s}.barra:hover,.barra.tip-on{opacity:.7}
.punto{cursor:pointer}.punto:hover,.punto.tip-on{stroke:var(--txt);stroke-width:3}

/* ---------- Estado del lote ---------- */
.estado-in{display:flex;align-items:center;gap:18px}
.rings{width:min(44vw,190px);flex:none;display:block}
.ley-an{display:grid;gap:10px}
.ley-an span{display:block;font-size:17px;color:var(--txt2)}
.ley-an b{font-size:30px;line-height:1.05;display:block}
.ley-an b small{font-size:16px;margin-left:2px}
.frase{color:var(--txt3);font-size:17px;margin:12px 0 0}
.voz{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--btn2);border-radius:999px;padding:9px 15px;font-size:16px;font-weight:600}
.voz svg{width:19px;height:19px}
.mini{width:100%;display:block;margin-top:4px}
.emo-tile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:28px;margin-bottom:10px}
.seq-txt{font-size:19px;line-height:1.25;margin:0 0 6px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--card3);margin:14px 0 6px}
.gauge i{position:absolute;top:0;bottom:0;border-radius:6px;background:#64d2ff55}
.gauge em{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--txt);transform:translateX(-2px)}
.gauge-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ter)}
.luna{width:68px;display:block;margin:2px 0 10px}.luna .disco{fill:var(--card3)}
.hora{font-size:38px;line-height:1.05;display:block;margin:2px 0 6px}.hora small{font-size:18px;margin-left:4px}
.astro .sub{display:block;margin-top:2px}

/* ---------- Alertas y riesgos ---------- */
.alerta{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--sep)}
.alerta:first-of-type{border-top:0;padding-top:2px}
.dot{width:13px;height:13px;border-radius:50%;flex:none;margin-top:6px;background:var(--verde)}
.dot.atención{background:var(--amarillo)}.dot.alerta{background:var(--rojo)}
.alerta b{display:block;font-size:18px;margin-bottom:2px}
.alerta p{margin:0;font-size:16px;color:var(--sec)}
.riesgos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.riesgos svg{width:100%;max-width:78px;display:block;margin:0 auto 6px}
.riesgos b{display:block;font-size:15px}
.riesgos span{font-size:14px;color:var(--sec)}.riesgos span.verde{color:var(--verde)}.riesgos span.amarillo{color:var(--amarillo)}.riesgos span.rojo{color:var(--rojo)}

/* ---------- Gráficas y fichas ---------- */
.graf{width:100%;display:block;margin-top:6px;touch-action:pan-y}
.ley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:var(--sec);margin-top:10px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ley i.l{height:3px;border-radius:2px;vertical-align:4px;width:16px}.ley i.c{border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:var(--card2);border-radius:14px;padding:11px 12px}
.kpis span{display:block;font-size:14px;color:var(--sec)}
.kpis b{font-size:24px;display:block}
.kpis em{font-style:normal;font-size:14px;color:var(--sec)}
.tile .ico{font-size:26px;display:block;margin-bottom:4px}
.tile h2{font-size:17px;font-weight:500;color:var(--txt2);margin:0}
.tile .sub{font-size:15.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--card2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.verde{color:var(--verde)}.amarillo{color:var(--amarillo)}.rojo{color:var(--rojo)}
.tend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tend div{background:var(--card2);border-radius:16px;padding:12px}
.tend span{display:block;font-size:15px;color:var(--sec)}
.tend b{font-size:28px;display:block;margin:2px 0;white-space:nowrap}
.tog{display:inline-flex;background:var(--segbg);border-radius:12px;padding:3px;margin-bottom:8px;flex-wrap:wrap}
.tog button{padding:9px 16px;border-radius:9px;font-size:16px;font-weight:600;color:var(--sec)}
.tog button[aria-pressed=true]{background:var(--sel);color:var(--txt);box-shadow:0 1px 3px #0002}
.tog.grande button{padding:12px 24px;font-size:18px}
.tog.tres{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:600px}
.tog.tres button{padding:9px 4px;line-height:1.2;text-align:center}.tog.tres button b{display:block;font-size:22px}
.temp-mes div{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--sep)}
.temp-mes div:first-child{border-top:0}
.temp-mes i{width:15px;height:15px;border-radius:50%;flex:none}
.temp-mes span{flex:1;font-size:19px}
.temp-mes b{font-size:32px}.temp-mes b small{font-size:17px;margin-left:2px}
@media(max-width:520px){.tend b{font-size:23px}.kpis b{font-size:19px}.kpis{gap:6px}.kpis div{padding:9px}.tog.tres button{font-size:14px}.tog.grande button{padding:11px 18px}}

/* ---------- Ventanita con números ---------- */
#tip{position:fixed;z-index:3000;pointer-events:none;background:var(--tip);color:var(--txt);border-radius:14px;padding:11px 13px;font-size:16px;line-height:1.4;max-width:290px;box-shadow:0 8px 28px #0007;border:1px solid var(--sep)}
#tip>b:first-child{display:block;font-size:18px;margin-bottom:4px}
#tip div{margin:3px 0}

/* ---------- Mapa ---------- */
#map{height:var(--mh,330px);border-radius:16px;background:var(--card2);position:relative;z-index:0;isolation:isolate}
.mapa-slot{--mh:300px}.mapa-slot.grande{--mh:min(56vh,520px)}
[data-tema=oscuro] .tiles-osc{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.5)}
.leaflet-container{font:inherit;background:var(--card2)}
.leaflet-control-attribution{background:var(--attr)!important;color:var(--sec)!important}.leaflet-control-attribution a{color:var(--sec)!important}
.leaflet-bar a{background:var(--card2)!important;color:var(--txt)!important;border-color:var(--card3)!important}
.leaflet-tooltip{background:var(--card2);color:var(--txt);border:0;border-radius:8px;box-shadow:none}.leaflet-tooltip-top:before{border-top-color:var(--card2)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--acento);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--lima)}
.pin.on{background:var(--txt);box-shadow:0 0 0 3px var(--lima),0 0 18px var(--lima)}
#banner-mapa{position:absolute;z-index:500;top:12px;left:50%;transform:translateX(-50%);background:#000c;backdrop-filter:blur(10px);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:16px;pointer-events:none;white-space:nowrap}
.capas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.capas button,.chip{background:var(--card2);border-radius:999px;padding:9px 15px;font-size:16px;font-weight:600}
.capas button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--txt);color:var(--bg)}
.chip[aria-pressed=true]::before{content:"✓ "}
.capa-txt{font-size:15px;color:var(--sec);margin:8px 2px 0}
.lista{background:var(--card);border-radius:22px;overflow:hidden;margin-top:12px}
.lista button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-top:1px solid var(--sep);position:relative}
.lista button:first-child{border-top:0}
.lista .ico{width:40px;height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.lista b{display:block;font-weight:600;font-size:18px}.lista small{color:var(--sec);font-size:15px}
.lista .chev{position:static;margin-left:auto;background:none}

/* ---------- Formularios ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{background:var(--card2);border-radius:16px;padding:13px;border:2px solid transparent;text-align:left;position:relative}
.opt .e{font-size:28px;display:block;margin-bottom:4px}
.opt b{display:block;font-size:18px}
.opt small{display:block;font-size:15px;color:var(--sec);margin-top:2px;line-height:1.3}
.opt[aria-pressed=true]{border-color:var(--lima);background:#c6f43218}
.opt[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--lima);color:var(--on-lima);font-size:14px;font-weight:800;display:grid;place-items:center}
.sug{display:block;margin-top:5px;font-size:13px;color:var(--lima);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--segbg);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:11px 4px;border-radius:9px;font-size:17px;font-weight:600;color:var(--txt3);text-align:center}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--txt);box-shadow:0 1px 3px #0002}
.nut{padding:12px 0;border-top:1px solid var(--sep)}.nut:first-of-type{border-top:0;padding-top:0}
.nut header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.nut header b{font-size:18px}.nut header span{font-size:15px;color:var(--sec);text-align:right}
.nut p{font-size:15px;color:var(--sec);margin:6px 2px 0}
.medida .big{margin:2px 0 4px}
.paso{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.paso button{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:24px;line-height:1;display:grid;place-items:center}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--track,var(--card3))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 8px #0006;border:.5px solid #0002}
.rng::-moz-range-track{height:8px;border-radius:4px;background:var(--track,var(--card3))}
.rng::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0006}
.escala{display:flex;justify-content:space-between;font-size:14px;color:var(--ter)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--sep)}
.fila:first-of-type{border-top:0;padding-top:0}
.fila b{font-size:18px;font-weight:600}.fila small{display:block;color:var(--sec);font-size:15px}
.sw{width:54px;height:33px;border-radius:17px;background:var(--sw-off);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:29px;height:29px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px #0004}
.sw[aria-checked=true]{background:var(--verde)}.sw[aria-checked=true]::after{transform:translateX(21px)}
.stepper{display:flex;align-items:center;gap:6px}.stepper output{min-width:48px;text-align:center;font-size:22px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--card2);font-size:22px;display:grid;place-items:center;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:15px;color:var(--sec);margin:0 2px 5px}
.campo input,.buscar input{width:100%;background:var(--campo);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;font-size:17px;color:var(--txt);outline:none;-webkit-appearance:none;appearance:none}
.campo input:focus,.buscar input:focus{border-color:var(--agua)}
.buscar{position:relative;margin-bottom:12px}
.buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--sec)}
.buscar input{padding-left:42px}
input::placeholder{color:var(--sec)}
details{margin-top:10px}summary{cursor:pointer;color:var(--agua);font-size:17px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details ol,details ul{color:var(--txt3);font-size:16px;padding-left:20px;margin:8px 0 0}details li{margin:4px 0}
.factores{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.factores span{font-size:14px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--card2)}
.estaca{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--lima);background:var(--card);border-radius:999px;padding:8px 14px;margin:-4px 0 6px 2px}
.estaca-sub{font-size:15px;color:var(--sec);margin:0 4px 14px}
.token{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--card2);border-radius:12px;padding:12px;word-break:break-all;margin:8px 0}
.error{color:var(--rojo);font-size:16px;margin:8px 2px}
.ok-txt{color:var(--verde);font-size:16px;margin:8px 2px}
.mini-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.mini-datos div{background:var(--card2);border-radius:14px;padding:10px 12px}
.mini-datos span{display:block;font-size:14px;color:var(--sec)}.mini-datos b{font-size:21px}

/* ---------- Rotación ---------- */
.prios{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.prios{grid-template-columns:repeat(3,1fr)}}
.plan .plan-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rango{font-size:14px;font-weight:700;color:var(--lima);text-transform:uppercase;letter-spacing:.04em}
.plan h2{padding-right:0;margin:4px 0 0;font-size:22px}
.plan-h svg{width:76px;flex:none}
.temps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}

 display:grid;grid-template-columns:repeat(6,1fr);gap:1px;padding:5px;border-radius:999px;background:var(--tabbar);

 transition:left .5s cubic-bezier(.3,1.25,.4,1),top .5s cubic-bezier(.3,1.25,.4,1),width .5s cubic-bezier(.3,1.25,.4,1),height .5s,opacity .2s;pointer-events:none}

 .tabbar{left:14px;top:14px;bottom:14px;transform:none;width:224px;display:flex;flex-direction:column;gap:4px;border-radius:26px;padding:16px 10px}

 .tabbar .corto{display:none}.tabbar .largo{display:inline}
 .fab{display:none!important}
}

/* ---------- Hojas (detalle y asistente) ---------- */

dialog::backdrop{background:#000a}

/* ---------- Animaciones ---------- */
@keyframes entraDer{from{opacity:0;transform:translateX(30px)}}
@keyframes entraIzq{from{opacity:0;transform:translateX(-30px)}}
.entra-der{animation:entraDer .45s cubic-bezier(.2,.8,.2,1) both}
.entra-izq{animation:entraIzq .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.opt[aria-pressed=true]::after,.chip[aria-pressed=true],.seg button[aria-pressed=true],.tog button[aria-pressed=true]{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes brote{0%{opacity:0;transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:none}}
.anim .emo-tile,.anim .temp .emo,.anim .evaluar .e,.anim .tile .ico{animation:brote .65s cubic-bezier(.3,1.4,.5,1) .2s both}

.temp:hover .emo,.emo-tile:hover,.evaluar div:hover .e,.tile:hover .ico{animation:balanceo .9s ease-in-out}
@media(hover:hover) and (pointer:fine){.card{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
 .enlace:hover,.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0005}}

.esq{border-radius:22px;min-height:120px;background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:brillo 1.3s linear infinite}
.planta{width:118px;flex:none;overflow:visible;display:block}

@keyframes crece{to{stroke-dashoffset:0}}

.planta.quieta .tallo{animation:none;stroke-dashoffset:0}.planta.quieta .hoja,.planta.quieta .flor{animation:none;transform:none}
.planta .flor{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:abre .6s cubic-bezier(.3,1.6,.5,1) 1.5s forwards}

<script>

const PREF = (() => { try { return JSON.parse(localStorage.getItem("rotacion-pref") || "{}"); } catch (e) { return {}; } })();

  prios:["nitrogeno","agua"], lotes:1, ultimos:[], riego:false, ha:5, anios:5, res:null, panel:null, sim:null,
  planSim:0, tab:2, tabPrev:null, ref:null, refClave:null, refZona:null, origenSuelo:null, modoRec:"lluvia", pins:{}, volando:false, pantalla:"carga", indAbierto:null, climaZona:null, configurado:false, buscar:"",
  idioma:PREF.idioma || ((navigator.language || "es").startsWith("en") ? "en" : "es"), tema:PREF.tema || "oscuro", luna:PREF.luna ?? true, sol:PREF.sol ?? true,
  modoAcceso:"entrar", estacas:[], fuente:null, externos:null, tokenNuevo:null, sonido:true, chat:[], compartir:false};
const L = (es, en) => S.idioma === "en" ? en : es;

const N = (v, d = 0) => Number(v).toLocaleString(LOC(), {maximumFractionDigits:d, minimumFractionDigits:0});
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : "";

const MC = i => (S.idioma === "en" ? ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] : ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"])[i];
const DIAS_MES = [31,28,31,30,31,30,31,31,30,31,30,31];
const hoy = new Date();
const fecha = () => hoy.toLocaleDateString(LOC(), {weekday:"long", day:"numeric", month:"long"}).toUpperCase();
const PAL = {
 oscuro:{suelo:"#ff7a45", agua:"#32c8ff", clima:"#a8f04a", lluvia:"#3fb7f7", evap:"#ffd60a", temp:"#ff9f0a", hum:"#64d2ff", verde:"#30d158", amarillo:"#ffd60a",
         rojo:"#ff453a", lima:"#c6f432", morado:"#a59bf5", gris:"#8e8e93", tmin:"#5ac8fa", pista:"#3a3a3c", luna:"#f4efd9"},
 claro:{suelo:"#f0612a", agua:"#0a9fd8", clima:"#4caf2a", lluvia:"#007aff", evap:"#c99300", temp:"#e67e00", hum:"#0096c7", verde:"#28a745", amarillo:"#c99300",
        rojo:"#ff3b30", lima:"#5b9a00", morado:"#6e5ff0", gris:"#aeaeb2", tmin:"#2a9fd6", pista:"#d1d1d6", luna:"#f2d36b"}};
const COL = {...PAL.oscuro}, SEMC = {};
const NIVC = {nulo:"verde", bajo:"verde", medio:"amarillo", alto:"rojo"};
const NIVT = n => ({nulo:L("Sin riesgo","No risk"), bajo:L("Bajo","Low"), medio:L("Medio","Medium"), alto:L("Alto","High")})[n];
const TIPOC = {cereal:"#ffcc4d", leguminosa:"#30d158", tuberculo:"#d08a4c", oleaginosa:"#ff9f0a", abono_verde:"#a8f04a", cobertura:"#8e8e93"};
const PRI = () => [["agua","💧",L("Ahorrar agua","Save water"),L("Cultivos que piden menos agua","Crops that need less water")],
             ["forraje","🐄",L("Comida para el ganado","Feed for livestock"),L("Rastrojo y follaje para los animales","Residue and leaves for animals")],
             ["nitrogeno","🌱",L("Abono natural","Natural fertilizer"),L("Plantas que fijan nitrógeno al suelo","Plants that fix nitrogen in the soil")],
             ["erosion","⛰️",L("Frenar la erosión","Stop erosion"),L("Suelo cubierto, menos arrastre","Covered soil, less runoff")],
             ["materia_organica","🍂",L("Materia orgánica","Organic matter"),L("Tierra más viva y fértil","Livelier, more fertile soil")],
             ["mercado","🛒",L("Vender bien","Sell well"),L("Cultivos con salida en la zona","Crops with local demand")]];
const IND = k => ({agua:["💧",L("Agua","Water"),L("Uso del agua","Water use")], nitrogeno:["🌱",L("Nitrógeno","Nitrogen"),L("Nitrógeno","Nitrogen")],
             erosion:["⛰️",L("Erosión","Erosion"),L("Frena la erosión","Erosion control")], materia_organica:["🍂",L("Materia org.","Org. matter"),L("Materia orgánica","Organic matter")],
             forraje:["🐄",L("Forraje","Forage"),L("Forraje","Forage")], mercado:["🛒",L("Mercado","Market"),L("Mercado","Market")],
             resiliencia:["🛡️",L("Años secos","Dry years"),L("Aguante en años secos","Dry-year resilience")]})[k];
const RANGO = i => [L("La más recomendada","Most recommended"), L("Recomendación 2","Recommendation 2"), L("Recomendación 3","Recommendation 3")][i];
let mapa, capaAct = null, capaObj = null, punto = null;
/* ---------- Uso sin señal: se guardan las últimas respuestas de lectura y se muestran si se cae la conexión ---------- */
const GUARDABLES = /^\/api\/(yo|zonas|panel|recomendar|simular|suelo_historico|referencia|datos_lote|clima_diario|estacas|cultivos)\b/;
const CKEY = "agrostake-sin-red";
function cacheLeer(){ try { return JSON.parse(localStorage.getItem(CKEY) || "{}"); } catch (e) { return {}; } }
function claveCache(u, body){
  let z = ""; try { const b = body ? JSON.parse(body) : {}; z = [b.zona_id, b.lat, b.lon, (b.secuencia || []).join("+"), b.anios, b.ha].filter(x => x != null && x !== "").join(","); } catch (e) {}
  return `${u.split("?")[0]}|${S.idioma}|${z}|${u.includes("?") ? u.split("?")[1] : ""}|${body ? body.length + ":" + [...body].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) : ""}`;
}
function cacheGuardar(k, j){
  try { const c = cacheLeer(); c[k] = {t:Date.now(), j};
        Object.keys(c).sort((a, b) => c[b].t - c[a].t).slice(60).forEach(x => delete c[x]);
        localStorage.setItem(CKEY, JSON.stringify(c)); }
  catch (e) { try { localStorage.removeItem(CKEY); } catch (_) {} }
}
function cacheBuscar(k){
  const c = cacheLeer(); if (c[k]) return c[k];
  const [ruta, idi, z] = k.split("|");          // si no hay la respuesta exacta: la más reciente de esa ruta y esa zona
  return Object.entries(c).filter(([x]) => { const p = x.split("|"); return p[0] === ruta && p[1] === idi && (!z || p[2].split(",")[0] === z.split(",")[0]); })
    .sort((a, b) => b[1].t - a[1].t).map(x => x[1])[0];
}
function marcarSinRed(t){
  S.sinRed = true; const b = $("#sin-red"); if (!b) return;
  if (!t && !b.hidden) return;                  // no borra la hora de los datos guardados que ya se está mostrando
  b.innerHTML = `📴 ${L("Sin señal: estás viendo los últimos datos guardados","No signal: you are seeing the last saved data")}${t ? ` (${haceCuanto(new Date(t).toISOString())})` : ""}.`;
  b.hidden = false;
}
/* El servidor tarda (en Render gratis se duerme a los 15 min y tarda cerca de un minuto en despertar) o respondió con error */
function avisoServidor(modo){
  const b = $("#servidor"); if (!b) return;
  if (!modo || S.sinRed) { b.hidden = true; return; }
  b.innerHTML = modo === "lento" ? `⏳ ${L("Cargando tus datos… si el servidor estaba dormido, puede tardar hasta un minuto.","Loading your data… if the server was asleep, it can take up to a minute.")}`
                                 : `🔄 ${L("El servidor no respondió; reintentando solo…","The server did not respond; retrying automatically…")}`;
  b.hidden = false;
}
function marcarConRed(){ if (!S.sinRed) return; S.sinRed = false; $("#sin-red").hidden = true; }
addEventListener("offline", () => marcarSinRed(Math.max(0, ...Object.values(cacheLeer()).map(x => x.t)) || null));
addEventListener("online", () => { marcarConRed(); if (S.pantalla === "app") { actualizar(true); cargarEstadoDatos(); guardarPerfil(); } });
async function api(u, op = {}){
  const clave = GUARDABLES.test(u) ? claveCache(u, op.body) : null;
  let r;
  try { r = await fetch(u, {...op, headers:{"Content-Type":"application/json", "X-Idioma":S.idioma, ...(op.headers || {})}}); }
  catch (err) {
    const c = clave && cacheBuscar(clave);
    if (c) { marcarSinRed(c.t); return c.j; }
    const e = new Error(L("Sin conexión","No connection")); e.sinRed = true; marcarSinRed(); throw e;
  }
  const j = (r.headers.get("content-type") || "").includes("json") ? await r.json().catch(() => null) : null;
  if (!r.ok || !j) { const e = new Error((j && j.error) || r.statusText || L("Respuesta inesperada del servidor","Unexpected server response")); e.estado = r.ok ? 502 : r.status; throw e; }
  if (clave) cacheGuardar(clave, j);
  marcarConRed();
  return j;
}
/* ---------- Estado de la descarga automática de datos de la NASA ---------- */
async function cargarEstadoDatos(){
  clearTimeout(cargarEstadoDatos.t);
  let e; try { const r = await fetch("/api/estado_datos"); e = await r.json(); if (!e || typeof e !== "object") throw 0; }
  catch (err) { cargarEstadoDatos.t = setTimeout(cargarEstadoDatos, 10000); return; }
  const antes = S.estadoDatos; S.estadoDatos = e;
  const pz = S.zona?.punto && S.puntoEstado === "descargando" && Object.entries(e.puntos || {}).find(([k]) => mismoPunto(k, S.zona.id))?.[1];
  if (pz) terminarPunto(S.zona, pz === "listo");                   // terminó la descarga del punto libre en el servidor
  const mia = S.zona && (e.listas || []).includes(S.zona.id), miaAntes = S.zona && (antes?.listas || []).includes(S.zona.id);
  if (antes && mia && !miaAntes) {                                 // llegaron los datos de la zona que estás mirando: se muestran ya
    avisar(L("Listo: ya llegaron los datos reales de la NASA de tu zona.","Done: real NASA data for your area has arrived.")); if (S.pantalla === "app") actualizar(true);
  } else if (antes && antes.activo && !e.activo && e.zonas_reales && !miaAntes) { avisar(L("Listo: ya tienes los datos reales de la NASA.","Done: real NASA data is ready.")); if (S.pantalla === "app") actualizar(true); }
  $$(".chip-datos").forEach(c => c.outerHTML = chipDatos());
  // seguido mientras descarga o mientras la primera descarga no ha empezado; luego, cada minuto
  cargarEstadoDatos.t = setTimeout(cargarEstadoDatos, e.activo || S.puntoEstado === "descargando" || (!e.ultima && !e.sin_internet && !e.apagado) ? 3000 : 60000);
}

}

const tip = $("#tip");
function verTip(el){
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let y = r.top - h - 10; if (y < 8) y = Math.min(innerHeight - h - 8, r.bottom + 10);
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; tip.style.top = y + "px";
  $$(".tip-on").forEach(x => x.classList.remove("tip-on")); el.classList.add("tip-on");
}
function ocultarTip(){ tip.hidden = true; $$(".tip-on").forEach(x => x.classList.remove("tip-on")); }
document.addEventListener("pointerover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t && e.pointerType === "mouse") verTip(t); });
document.addEventListener("pointerout", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t && e.pointerType === "mouse" && !(e.relatedTarget && t.contains(e.relatedTarget))) ocultarTip(); });
document.addEventListener("pointerdown", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t) verTip(t); else ocultarTip(); });
addEventListener("scroll", ocultarTip, {passive:true});

function anillos(lista, size = 180, sw = 18, gap = 3){
  const c = size / 2; let s = `<svg viewBox="0 0 ${size} ${size}" class="rings" aria-hidden="true">`;

    const r = c - sw / 2 - i * (sw + gap), C = 2 * Math.PI * r, v = Math.max(0, Math.min(100, a.v));
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${a.c}" stroke-opacity=".2" stroke-width="${sw}"/>`;
    if (v > 0) s += `<circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${a.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;
    if (sw >= 12) { const y = c - r, k = sw * .22; s += `<path d="M${c - k} ${y}h${2 * k}M${c + k - k * .9} ${y - k * .9}l${k * .9} ${k * .9}-${k * .9} ${k * .9}" stroke="#000" stroke-width="${sw * .13}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; }
  });
  return s + "</svg>";
}
function anillo(v, color, texto, size = 72, sw = 8, emoji){

    ${emoji ? `<text x="${c}" y="${c + size * .11}" font-size="${size * .3}" text-anchor="middle">${emoji}</text>` :
      `<text class="gs" x="${c}" y="${c + size * .11}" font-size="${size * .3}" font-weight="700" text-anchor="middle" font-family="ui-rounded,-apple-system,system-ui,sans-serif">${texto}</text>`}</svg>`;
}

/* ================= Luna y sol (cálculos aproximados) ================= */
function lunaHoy(d = new Date()){
  const SIN = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const edad = (((d - ref) / 864e5) % SIN + SIN) % SIN, f = edad / SIN, ilum = (1 - Math.cos(2 * Math.PI * f)) / 2;
  const F = [[1.85, "Luna nueva", "New moon"], [5.54, "Luna creciente", "Waxing crescent"], [9.23, "Cuarto creciente", "First quarter"], [12.92, "Gibosa creciente", "Waxing gibbous"],
             [16.61, "Luna llena", "Full moon"], [20.3, "Gibosa menguante", "Waning gibbous"], [23.99, "Cuarto menguante", "Last quarter"], [27.68, "Luna menguante", "Waning crescent"], [SIN + 1, "Luna nueva", "New moon"]];
  const x = F.find(z => edad < z[0]);
  return {f, ilum, nombre:L(x[1], x[2]), llena:(SIN / 2 - edad + SIN) % SIN, nueva:SIN - edad};
}
function lunaSvg(f, size = 68){
  const c = size / 2, r = c - 2, k = Math.cos(2 * Math.PI * f), rx = Math.abs(k) * r;
  const d = f < .5 ? `M${c} ${c - r}A${r} ${r} 0 0 1 ${c} ${c + r}A${rx} ${r} 0 0 ${k > 0 ? 0 : 1} ${c} ${c - r}Z` : `M${c} ${c - r}A${r} ${r} 0 0 0 ${c} ${c + r}A${rx} ${r} 0 0 ${k > 0 ? 1 : 0} ${c} ${c - r}Z`;
  return `<svg viewBox="0 0 ${size} ${size}" class="luna" aria-hidden="true"><circle class="disco" cx="${c}" cy="${c}" r="${r}"/><path d="${d}" fill="${COL.luna}"/></svg>`;
}
/* Salida y puesta del sol (ecuaciones de NOAA). Colombia: UTC-5 todo el año. */
function solHoy(lat, lon, d = new Date()){
  const r = Math.PI / 180, n = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 1)) / 864e5) + 1, g = 2 * Math.PI / 365 * (n - 1);
  const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
  const de = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(de)) - Math.tan(lat * r) * Math.tan(de)) / r;
  const sal = 720 - 4 * (lon + ha) - eq - 300, pue = 720 - 4 * (lon - ha) - eq - 300;
  return {salida:sal, puesta:pue, horas:pue - sal};
}
const hora = m => { m = Math.round(m); let h = Math.floor(m / 60); const mi = m % 60, ap = h < 12 ? L("a. m.","AM") : L("p. m.","PM"); h = h % 12 || 12; return [`${h}:${String(mi).padStart(2, "0")}`, ap]; };

const VOZ = "speechSynthesis" in window;
let hablandoBtn = null;
function hablar(t, btn){
  if (!VOZ || !t) return;
  speechSynthesis.cancel(); if (hablandoBtn) hablandoBtn.classList.remove("hablando");
  const u = new SpeechSynthesisUtterance(t), lg = S.idioma === "en" ? "en" : "es";
  u.lang = lg === "en" ? "en-US" : "es-CO"; u.rate = .95;
  const vs = speechSynthesis.getVoices(), v = vs.find(x => x.lang === u.lang) || vs.find(x => x.lang.startsWith(lg));
  if (v) u.voice = v;
  if (btn) { hablandoBtn = btn; btn.classList.add("hablando"); u.onend = u.onerror = () => btn.classList.remove("hablando"); }
  speechSynthesis.speak(u);
}
function paraVoz(t){
  return t.replace(/[\p{Extended_Pictographic}\uFE0F]/gu, "").replace(/\.\.+/g, ".").replace(/(\d)\s*MM\b/gi, `$1 ${L("milímetros","millimeters")}`).replace(/°C/g, L(" grados"," degrees")).replace(/m³/g, L(" metros cúbicos"," cubic meters"))
          .replace(/\/100/g, L(" por ciento"," percent")).replace(/(\d)\s*%/g, `$1 ${L("por ciento","percent")}`).replace(/→/g, L(", luego, ",", then, ")).replace(/(\d)\s*L\b/g, `$1 ${L("litros","liters")}`).replace(/\s+/g, " ").trim();
}
function textoDe(el){
  const partes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode:n => n.parentElement.closest("svg,.leer,.chev,.voz,.acciones,script") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let previo = null;
  while (w.nextNode()) {
    const t = w.currentNode.textContent.replace(/\s+/g, " ").trim(); if (!t) continue;
    let b = w.currentNode.parentElement; while (b !== el && getComputedStyle(b).display === "inline") b = b.parentElement;
    if (previo && b !== previo && !/[.:,;!?]$/.test(partes[partes.length - 1])) partes.push(".");
    partes.push(t); previo = b;
  }
  return paraVoz(partes.join(" ").replace(/ \./g, "."));
}
function ponerAltavoces(raiz){

  raiz.querySelectorAll(".card").forEach(c => {

    if (c.querySelector(":scope > .chev")) c.classList.add("con-chev");
    c.insertAdjacentHTML("afterbegin", `<button type="button" class="leer" data-leer aria-label="${L("Escuchar","Listen")}">${ICO.alt}</button>`);
  });
}

function haceCuanto(iso){
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000), u = (n, es1, esn, en1, enn) => `${n} ${n === 1 ? L(es1, en1) : L(esn, enn)}`;
  const t = s < 90 ? u(Math.round(s / 60) || 1, "minuto", "minutos", "minute", "minutes") : s < 5400 ? u(Math.round(s / 60), "minuto", "minutos", "minute", "minutes")
          : s < 129600 ? u(Math.round(s / 3600), "hora", "horas", "hour", "hours") : u(Math.round(s / 86400), "día", "días", "day", "days");
  return L(`hace ${t}`, `${t} ago`);
}

function tieneColor(img){            // ¿la tesela trae algo dibujado o está toda transparente?

function ponerMedida(k, v){
  const [, mn, mx, st] = MED()[k]; v = Math.round(Math.max(mn, Math.min(mx, v)) / st) * st; v = +v.toFixed(1);
  S.suelo[k] = v;
  const o = $("#o-" + k), r = $("#r-" + k);
  o.firstChild.textContent = N(v, 1); r.value = v; r.style.setProperty("--track", trackDe(k, v));
  if (k === "ph") { o.style.color = colorPh(v); $("#t-ph").textContent = txtPh(v); $("#ph-liq")?.setAttribute("fill", colorPh(v)); }
  if (k === "humedad_pct" && $("#tq-nivel")) $("#tq-nivel").style.transform = `translateY(${100 - Math.max(0, Math.min(1, v / 50)) * 100}px)`;
  if (k === "temp_suelo_c") { const c = colorTemp(v); o.style.color = c; $("#term-merc").style.transform = `scaleY(${Math.max(.06, Math.min(1, (v - 20) / 20))})`; $("#term-merc").setAttribute("fill", c); $("#term-bulbo").setAttribute("fill", c); }
  marcarManual(); actualizar();
}
/* Barra de progreso de todas las cargas: avanza sola hasta ~92% en `ms` (más lento si el servidor tarda), cuando la tarea
   termina sube suave hasta 100% y se queda llena un momento antes de cerrar. Se mueve con requestAnimationFrame y busca
   la barra en cada cuadro, así no se reinicia si la página se redibuja. Devuelve el resultado de la tarea. */
function progreso(barra, ms, tarea, alPintar){
  const t0 = performance.now(); let listo = false, fin = null, wFin = 0, w = 0;
  const p = Promise.all([tarea ? Promise.resolve(tarea).catch(() => null) : null, new Promise(r => setTimeout(r, ms))]).then(([x]) => { listo = true; return x; });
  return new Promise(resolve => {
    const paso = now => {
      const t = now - t0;
      if (!listo) w = t < ms ? 92 * (1 - Math.pow(1 - t / ms, 2)) : 92 + 6 * (1 - Math.exp(-(t - ms) / 2500));
      else { if (fin === null) { fin = now; wFin = w; } w = wFin + (100 - wFin) * Math.min(1, (now - fin) / 280); }
      const el = barra(); if (el) { el.style.transition = "none"; el.style.width = w.toFixed(1) + "%"; }
      if (alPintar) alPintar(w);
      if (listo && now - fin >= 480) return resolve(p);
      requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
}
const refrescarYa = () => { actualizar(true); return new Promise(r => setTimeout(r, 30)).then(() => S.pendiente); };
async function cargando(texto, ms, tarea, pasos){
  const el = $("#cargador"), pr = $("#cargador-prog");
  $("#cargador-planta").innerHTML = planta(90, true); $("#cargador-txt").textContent = texto; el.hidden = false;
  let sub = $("#cargador-sub"); if (!sub) { $("#cargador-txt").insertAdjacentHTML("afterend", `<p id="cargador-sub"></p>`); sub = $("#cargador-sub"); }
  sub.textContent = pasos ? pasos[0] : "";
  const giro = pasos ? setInterval(() => { const i = Math.min(pasos.length - 1, Math.floor((performance.now() - t0) / (ms / pasos.length))); sub.textContent = pasos[i]; }, 250) : null, t0 = performance.now();
  pr.style.transition = "none"; pr.style.width = "0%";
  if (VOZ && S.sonido) speechSynthesis.cancel();
  const res = await progreso(() => pr, sinMov() ? 400 : ms, tarea);
  if (giro) clearInterval(giro);
  el.hidden = true; return res;
}

    [L("Revisando tu suelo…","Checking your soil…"), L("Cruzando con el clima de la NASA…","Matching with NASA weather…"), L("Ordenando según lo que te importa…","Ranking by what matters to you…")]);

}
$("#v2").addEventListener("input", e => { const k = e.target.dataset.k; if (k && e.target.type === "range") ponerMedida(k, parseFloat(e.target.value)); });
$("#v2").addEventListener("click", async e => {
  const ps = e.target.closest("[data-paso]"); if (ps) { const k = ps.dataset.paso; ponerMedida(k, S.suelo[k] + MED()[k][3] * +ps.dataset.d); return; }
  const dc = e.target.closest("[data-decir]"); if (dc) { hablar(paraVoz(LECTORES[{ph:"ph", humedad_pct:"humedad", temp_suelo_c:"temp"}[dc.dataset.decir]]()), dc); return; }
  if (e.target.closest("[data-guardar]")) { guardarDatos(); return; }
  if (e.target.closest("[data-ext]")) {
    const t0 = Date.now(), pasos = PASOS_CONSULTA();
    S.externos = {cargando:true, t0, w:0}; renderLote();
    const giro = setInterval(() => { const t = $("#consulta-txt"); if (t) t.textContent = pasos[Math.min(Math.floor((Date.now() - t0) / 650), pasos.length - 1)]; }, 200);
    const peticion = (async () => {
      try { const [lat, lon] = lugar(), r = await post("/api/datos_lote", {lat, lon});
        if (!r.variables) throw new Error(L("respuesta incompleta","incomplete answer")); return r; }
      catch (err) { return {error:err.sinRed ? L("Sin señal: conéctate a internet para consultar tu punto.","No signal: connect to the internet to look up your point.") : L("No se pudo consultar: ","Could not look up: ") + err.message}; }
    })();
    const res = await progreso(() => $("#consulta-barra"), sinMov() ? 300 : 3400, peticion, w => { if (S.externos?.cargando) S.externos.w = w; });
    clearInterval(giro); S.externos = res;
    if (S.tab === 2) renderLote(); return;
  }
  if (e.target.closest("[data-usar-ext]")) {
    const V = Object.fromEntries(S.externos.variables.map(x => [x.clave, x.valor]));
    if (V.ph != null) S.suelo.ph = Math.round(V.ph * 10) / 10;
    if (V.textura) S.textura = V.textura;
    if (S.externos.n_desde_mo) S.suelo.n = S.externos.n_desde_mo;
    if (V.humedad_pct != null) S.suelo.humedad_pct = Math.round(Math.max(5, Math.min(50, V.humedad_pct)) * 10) / 10;
    if (V.temp_suelo_c != null) S.suelo.temp_suelo_c = Math.round(Math.max(18, Math.min(45, V.temp_suelo_c)) * 10) / 10;
    marcarManual("mapas"); renderLote(); actualizar(); return;
  }
  const o = e.target.closest("[data-k][data-v]");
  if (o) { const k = o.dataset.k; if (k === "textura") S.textura = o.dataset.v; else S.suelo[k] = o.dataset.v; marcarManual(); renderLote(); actualizar();
    if (["n", "p", "k"].includes(k) && VOZ && S.sonido) hablar(paraVoz(lecturaNutriente(k, $("#v2")))); }
});

/* Un nutriente: solo el nivel que está marcado en la pantalla y lo que causa (nunca los otros niveles de la escala) */
function lecturaNutriente(k, raiz){
  const nu = NUT()[k], fila = (raiz || document).querySelector(`.nut[data-nut="${k}"]`);
  const marcado = fila?.querySelector('[aria-pressed="true"]')?.dataset.v || S.suelo[k];
  const x = nu[2].find(z => z[0] === marcado) || nu[2][1];
  return `${nu[0]}: ${x[1]}. ${x[2]}.`;
}

function tarjetaPlan(p, i, r){

  if (has(" evapor", " se seca", " se pierde", " pierde agua", " evaporat")) return {t:L(`En ${mn} la tierra pierde al secarse unos ${N(se.evap)} litros de agua por cada metro cuadrado, unos ${N(se.evap / DIAS_MES[mi])} litros al día. Llueven unos ${N(se.lluvia)} litros, así que ${se.balance < 0 ? "la tierra se seca más de lo que llueve" : "llueve más de lo que se seca"}.`, `In ${mn} about ${N(se.evap)} liters of water evaporate per square meter, about ${N(se.evap / DIAS_MES[mi])} liters a day. About ${N(se.lluvia)} liters of rain fall, so ${se.balance < 0 ? "the soil dries more than it rains" : "it rains more than it dries"}.`)};
  if (has(" aguacero", " tormenta", " extrem", " storm", " downpour", " heavy rain")) return {t:L(`Cada año caen unos ${N(C.extremas.dias, 1)} aguaceros de más de 50 milímetros en un día. El más grande registrado fue de ${N(C.extremas.max_dia)} milímetros.`, `Each year about ${N(C.extremas.dias, 1)} downpours exceed 50 millimeters in a day. The largest was ${N(C.extremas.max_dia)} millimeters.`)};
  if (has(" veranillo", " sequia", " drought", " dry spell")) return {t:L(`El riesgo de veranillo es ${NIVT(C.veranillo.nivel).toLowerCase()}: pueden venir hasta ${C.veranillo.dias} días secos seguidos en plena temporada de lluvias. El riesgo de sequía ahora es ${NIVT(S.panel.riesgos.sequia.nivel).toLowerCase()}.`, `The dry-spell risk is ${NIVT(C.veranillo.nivel).toLowerCase()}: up to ${C.veranillo.dias} dry days in a row can happen during the rainy season. Drought risk now is ${NIVT(S.panel.riesgos.sequia.nivel).toLowerCase()}.`)};
  if (has(" empieza", " empiezan", " comienza", " inicio de", " start", " temporada de lluvia", " rainy season")) return {t:L(`En tu zona las lluvias suelen empezar en ${C.inicio_lluvias}.`, `In your area the rains usually start in ${C.inicio_lluvias}.`)};
  if (has(" llov", " lluev", " lluvia", " rain")) {
    if (has(" dias", " cuantos", " days", " how many")) return {t:L(`En ${mn} llueve unos ${se.dias_lluvia} días. En total caen unos ${N(se.lluvia)} milímetros, es decir, ${N(se.lluvia)} litros por metro cuadrado. Es el promedio de la zona, no un pronóstico.`, `In ${mn} it rains about ${se.dias_lluvia} days. In total about ${N(se.lluvia)} millimeters fall, that is ${N(se.lluvia)} liters per square meter. It is the area's average, not a forecast.`)};
    return {t:L(`En ${mn} caen unos ${N(se.lluvia)} milímetros de lluvia en unos ${se.dias_lluvia} días. ${S.panel.anillos.agua.texto}`, `In ${mn} about ${N(se.lluvia)} millimeters of rain fall over about ${se.dias_lluvia} days. ${S.panel.anillos.agua.texto}`)};
  }
  if (has(" ph", " acidez", " acido", " acidity")) return {t:L(`El pH de tu suelo es ${N(S.suelo.ph, 1)}: ${txtPh(S.suelo.ph).toLowerCase()}.`, `Your soil pH is ${N(S.suelo.ph, 1)}: ${txtPh(S.suelo.ph).toLowerCase()}.`)};
  if (has(" nitrogeno", " fosforo", " potasio", " nutriente", " npk", " nitrogen", " phosphorus", " potassium", " nutrient")) { const nv = k => NIVT(S.suelo[k]).toLowerCase(); return {t:L(`Nitrógeno ${nv("n")}, fósforo ${nv("p")} y potasio ${nv("k")}.`, `Nitrogen ${nv("n")}, phosphorus ${nv("p")} and potassium ${nv("k")}.`)}; }
  if (has(" humedad", " moisture", " mojad", " seco ")) return {t:L(`La humedad de tu suelo es ${N(S.suelo.humedad_pct, 1)}% y el satélite mide ${N(C.humedad_sat)}% en la zona de raíces. Lo ideal está entre 20 y 35%.`, `Your soil moisture is ${N(S.suelo.humedad_pct, 1)}% and the satellite measures ${N(C.humedad_sat)}% in the root zone. Ideal is between 20 and 35%.`)};
  if (has(" ideam", " estacion", " station", " de donde", " fuente", " source", " where do")) {
    const e = S.ref?.ideam?.estaciones?.[0], r = S.ref?.suelo;
    return {t:(e ? L(`La estación del IDEAM más cercana es ${cap(e.nombre.toLowerCase())}, a ${N(e.distancia_km, 1)} kilómetros (${e.categoria.toLowerCase()}). `, `The nearest IDEAM station is ${cap(e.nombre.toLowerCase())}, ${N(e.distancia_km, 1)} kilometers away (${catIdeam(e.categoria).toLowerCase()}). `) : "") +
      (S.fuente ? L("El suelo viene de tu estaca.","Soil data comes from your stake.") : L("Con la estaca no conectada, los datos del suelo se llenan con el historial de tu zona.","With the stake not connected, soil data is filled with your area's history.")) +
      (S.panel && S.panel.ejemplo === false ? L(" El clima viene de NASA POWER.", " Weather comes from NASA POWER.") : L(" El clima todavía es de ejemplo; con internet se carga de NASA POWER.", " Weather is still sample data; with internet it loads from NASA POWER."))};
  }
  if (has(" estaca", " sensor", " stake")) { const e = S.estacas.find(z => z.ultima); return {t:e ? L(`Tu estaca ${e.nombre} envió su última lectura ${haceCuanto(e.ultima.fecha)}: pH ${N(e.ultima.ph ?? 0, 1)} y humedad ${N(e.ultima.humedad_pct ?? 0, 1)}%.`, `Your stake ${e.nombre} sent its last reading ${haceCuanto(e.ultima.fecha)}: pH ${N(e.ultima.ph ?? 0, 1)} and moisture ${N(e.ultima.humedad_pct ?? 0, 1)}%.`) : L("Todavía no hay lecturas de tu estaca. Puedes agregarla en Configuración.","There are no stake readings yet. You can add it in Settings.")}; }
  if (has(" suelo", " tierra", " soil")) return {t:L(`La salud de tu suelo está en ${S.panel.salud.valor}%. ${S.panel.salud.texto}`, `Your soil health is ${S.panel.salud.valor}%. ${S.panel.salud.texto}`)};
  if (has(" cuando", " when", " fecha", " plan de accion", " action plan")) {
    if (!plan) return {t:L("Con tus datos no encontré una rotación posible.","With your data I could not find a possible rotation.")};
    const {mes, ev} = eventosPlan(plan.cronograma), sig = ev.filter(e => e.tipo !== "hoy").slice(0, 3);
    return {t:(ev[0]?.tipo === "hoy" ? ev[0].texto + " " : "") + sig.map(e => { const [m, y] = mes(e.k); return `${cap(MES(m))} ${y}: ${e.texto}.`; }).join(" ")};
  }
  if (has(" siembr", " sembr", " cultiv", " recomien", " rotacion", " plant", " grow", " recommend", " rotation")) {
    if (!plan) return {t:L("Con tus datos no encontré una rotación posible. Revisa tu suelo en Mi lote.","With your data I could not find a possible rotation. Check your soil in My plot.")};
    return {t:L(`Te recomiendo ${plan.secuencia.map(z => z.nombre).join(", luego ")}, con ${plan.puntaje}%. ${plan.secuencia[0].por_que}`, `I recommend ${plan.secuencia.map(z => z.nombre).join(", then ")}, with ${plan.puntaje}%. ${plan.secuencia[0].por_que}`)};
  }
  if (has(" riesgo", " alerta", " peligro", " risk", " alert", " danger", " warning")) return {t:S.panel.alertas.map(a => `${a.titulo}. ${a.texto}`).join(" ")};
  if (has(" ahorr", " riego", " agua", " water", " irrigat", " save")) {
    if (!S.sim && plan) { try { S.sim = await post("/api/simular", {zona_id:S.zona.id, suelo:S.suelo, textura:S.textura, riego:S.riego, secuencia:plan.secuencia.map(z => z.cultivo), ultimos:S.ultimos, ha:S.ha, anios:S.anios}); } catch (e) {} }
    if (S.sim) { const a = S.sim.ahorro; return {t:a.m3_total >= 0 ? L(`Con la rotación te ahorrarías unos ${N(a.m3_total)} metros cúbicos de agua de riego al año en tus ${N(S.ha, 1)} hectáreas.`, `With the rotation you would save about ${N(a.m3_total)} cubic meters of irrigation water a year on your ${N(S.ha, 1)} hectares.`) : L(`Esta rotación pide unos ${N(-a.m3_total)} metros cúbicos más de riego al año; su beneficio está en el suelo.`, `This rotation needs about ${N(-a.m3_total)} more cubic meters of irrigation a year; its benefit is for the soil.`)}; }
  }
  if (has(" configur", " ajuste", " ubicacion", " idioma", " ingles", " settings", " location", " language", " english")) return {t:L("Toca Ajustes en la barra: ahí cambias tu ubicación, el riego, el idioma, el modo de pantalla y tus estacas.","Tap Settings in the bar: there you change your location, irrigation, language, display mode and stakes.")};
  return {t:L(`No entendí bien. Puedes preguntarme, por ejemplo: ${SUG().slice(0, 4).join(" ")}`, `I did not quite understand. You can ask me, for example: ${SUG().slice(0, 4).join(" ")}`)};
}

let anchoPrevio = innerWidth, esperaAncho;
addEventListener("resize", () => { clearTimeout(esperaAncho); esperaAncho = setTimeout(() => {
  moverIndicador();
  if (Math.abs(innerWidth - anchoPrevio) < 60 || S.pantalla !== "app" || S.tab === 2) return;
  anchoPrevio = innerWidth; if (S.tab === 4 && S.sim) pintarImp(S.sim, false); else RENDER[S.tab]();
}, 300); });
if (VOZ) speechSynthesis.getVoices();
arrancar();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname)))
  addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
