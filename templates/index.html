<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Rotación Caribe · Qué sembrar la próxima temporada</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
:root{
 --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--txt:#fff;--sec:#98989f;--ter:#6e6e73;
 --suelo:#ff7a45;--agua:#32c8ff;--clima:#a8f04a;--lluvia:#3fb7f7;--evap:#ffd60a;--temp:#ff9f0a;--hum:#64d2ff;
 --verde:#30d158;--amarillo:#ffd60a;--rojo:#ff453a;--lima:#c6f432;--morado:#a59bf5;
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--agua);outline-offset:2px;border-radius:10px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 132px}

/* ---------- Cabecera tipo iOS ---------- */
.fecha{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;margin:10px 4px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 10px}
.top h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(160deg,#a3add0,#5b678f);display:grid;place-items:center;font:600 18px var(--num);color:#fff;box-shadow:inset 0 1px 0 #ffffff50;flex:none}
.zona-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sec);margin:0 0 14px 2px}
.zona-pill b{color:var(--txt);font-weight:600}
.intro-tab{color:var(--sec);font-size:15px;margin:-6px 4px 14px}

/* ---------- Rejilla de tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c2,.c4{grid-column:span 2}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.c4{grid-column:span 4}}
.card{background:var(--card);border-radius:22px;padding:16px;position:relative;min-width:0;display:block;width:100%}
button.card{text-align:left;transition:transform .15s;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
button.card:active{transform:scale(.98)}
.card h2{font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em;padding-right:32px;line-height:1.25}
.card h3{font-size:16px;font-weight:600;margin:16px 0 8px}
.chev{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--card3);display:grid;place-items:center}
.chev::before{content:"";width:7px;height:7px;border-right:2.5px solid #c7c7cc;border-top:2.5px solid #c7c7cc;transform:translateX(-1px) rotate(45deg)}
.lbl{font-size:15px;color:#e5e5ea}
.big{font-size:34px;line-height:1.05;margin:2px 0 8px;display:block}
.big small,.mid small{font-size:.55em;margin-left:3px;font-weight:600}
.mid{font-size:26px;line-height:1.1;display:block}
.sub{color:var(--sec);font-size:14px;margin:0}
.pie{color:var(--ter);font-size:13px;margin:14px 4px 0}
.anim>*{animation:sube .45s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}
.anim>*:nth-child(5){animation-delay:.16s}.anim>*:nth-child(6){animation-delay:.2s}.anim>*:nth-child(n+7){animation-delay:.24s}
@keyframes sube{from{opacity:0;transform:translateY(10px)}}
.dibuja .arc{animation:dib 1s cubic-bezier(.3,.7,.2,1) both}
@keyframes dib{from{stroke-dasharray:0 2000}}

/* ---------- Estado del lote (anillos) ---------- */
.estado-in{display:flex;align-items:center;gap:18px}
.rings{width:min(46vw,190px);flex:none;display:block}
.ley-an{display:grid;gap:10px}
.ley-an span{display:block;font-size:15px;color:#e5e5ea}
.ley-an b{font-size:27px;line-height:1.05;display:block}
.ley-an b small{font-size:15px;margin-left:2px}
.frase{color:#d1d1d6;font-size:15px;margin:12px 0 0}
.voz{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--card2);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
.mini{width:100%;display:block;margin-top:4px}

/* ---------- Tarjetas pequeñas ---------- */
.emo-tile{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:27px;margin-bottom:10px}
.seq-txt{font-size:18px;line-height:1.25;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.medalla{text-align:center!important}
.medalla h2{text-align:left}
.medalla svg{width:96px;display:block;margin:2px auto 6px}
.medalla b{display:block;font-size:16px}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--card3);margin:14px 0 6px}
.gauge i{position:absolute;top:0;bottom:0;border-radius:5px;background:#64d2ff55}
.gauge em{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;transform:translateX(-2px)}
.gauge-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ter)}

/* ---------- Alertas y riesgos ---------- */
.alerta{display:flex;gap:12px;padding:12px 0;border-top:1px solid #2c2c2e}
.alerta:first-of-type{border-top:0;padding-top:2px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;background:var(--verde)}
.dot.atención{background:var(--amarillo)}.dot.alerta{background:var(--rojo)}
.alerta b{display:block;font-size:16px;margin-bottom:2px}
.alerta p{margin:0;font-size:14px;color:var(--sec)}
.riesgos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.riesgos svg{width:100%;max-width:74px;display:block;margin:0 auto 6px}
.riesgos b{display:block;font-size:13px}
.riesgos span{font-size:12px;color:var(--sec)}.riesgos span.verde{color:var(--verde)}.riesgos span.amarillo{color:var(--amarillo)}.riesgos span.rojo{color:var(--rojo)}

/* ---------- Gráficas ---------- */
.graf{width:100%;display:block;margin-top:6px}
.hit{cursor:pointer}.hit:hover{fill:#ffffff10}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sec);margin-top:8px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ley i.l{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:var(--card2);border-radius:14px;padding:10px 12px}
.kpis span{display:block;font-size:12px;color:var(--sec)}
.kpis b{font-size:21px}
.dias-box{background:var(--card2);border-radius:16px;padding:12px;margin-top:12px}
.dias-box header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:30px;height:30px;border-radius:50%;background:var(--card3);font-size:15px;display:grid;place-items:center;flex:none}
.tile .ico{font-size:22px;display:block;margin-bottom:4px}
.tile .lbl{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:#ffffff14}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.verde{color:var(--verde)}.amarillo{color:var(--amarillo)}.rojo{color:var(--rojo)}
.tend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tend div{background:var(--card2);border-radius:16px;padding:12px}
.tend span{display:block;font-size:13px;color:var(--sec)}
.tend b{font-size:26px;display:block;margin:2px 0;white-space:nowrap}
@media(max-width:520px){.tend b{font-size:22px}.kpis b{font-size:17px}.kpis{gap:6px}.kpis div{padding:9px}}
.tog{display:inline-flex;background:var(--card2);border-radius:10px;padding:2px;margin-bottom:6px}
.tog button{padding:6px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sec)}
.tog button[aria-pressed=true]{background:#636366;color:#fff}

/* ---------- Mapa ---------- */
#map{height:var(--mh,330px);border-radius:16px;background:#1a1a1a;position:relative;z-index:0;isolation:isolate}
.mapa-slot{--mh:300px}.mapa-slot.grande{--mh:min(56vh,520px)}
.tiles-osc{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.5)}
.leaflet-container{font:inherit;background:#111}
.leaflet-control-attribution{background:#000a!important;color:#888!important}.leaflet-control-attribution a{color:#aaa!important}
.leaflet-bar a{background:#2c2c2e!important;color:#fff!important;border-color:#3a3a3c!important}
.leaflet-tooltip{background:#2c2c2e;color:#fff;border:0;border-radius:8px;box-shadow:none}.leaflet-tooltip-top:before{border-top-color:#2c2c2e}
.pin{width:22px;height:22px;border-radius:50%;background:var(--lima);border:4px solid #000;box-shadow:0 0 0 2px var(--lima)}
.pin.on{background:#fff;box-shadow:0 0 0 3px var(--lima),0 0 18px var(--lima)}
#banner-mapa{position:absolute;z-index:500;top:12px;left:50%;transform:translateX(-50%);background:#000c;backdrop-filter:blur(10px);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;pointer-events:none;white-space:nowrap}
.capas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.capas button,.chip{background:var(--card2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.capas button[aria-pressed=true],.chip[aria-pressed=true]{background:#fff;color:#000}
.capa-txt{font-size:13px;color:var(--sec);margin:8px 2px 0}
.lista{background:var(--card);border-radius:22px;overflow:hidden;margin-top:12px}
.lista button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-top:1px solid #2c2c2e;position:relative}
.lista button:first-child{border-top:0}
.lista .ico{width:38px;height:38px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.lista b{display:block;font-weight:600;font-size:16px}.lista small{color:var(--sec);font-size:13px}
.lista .chev{position:static;margin-left:auto;background:none}

/* ---------- Formularios ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{background:var(--card2);border-radius:16px;padding:12px;border:2px solid transparent;text-align:left;position:relative}
.opt .e{font-size:26px;display:block;margin-bottom:4px}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13px;color:var(--sec);margin-top:2px;line-height:1.3}
.opt[aria-pressed=true]{border-color:var(--lima);background:#c6f43214}
.opt[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--lima);color:#000;font-size:13px;font-weight:800;display:grid;place-items:center}
.sug{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--lima);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:10px 4px;border-radius:9px;font-size:15px;font-weight:600;color:#d1d1d6;text-align:center}
.seg button[aria-pressed=true]{background:#636366;color:#fff}
.nut{padding:12px 0;border-top:1px solid #2c2c2e}.nut:first-of-type{border-top:0;padding-top:0}
.nut header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.nut header b{font-size:16px}.nut header span{font-size:13px;color:var(--sec)}
.nut p{font-size:13px;color:var(--sec);margin:6px 2px 0}
.medida .big{margin:2px 0 4px}
.paso{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center}
.paso button{width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:22px;line-height:1;display:grid;place-items:center}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--track,#3a3a3c)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px #000a}
.rng::-moz-range-track{height:8px;border-radius:4px;background:var(--track,#3a3a3c)}
.rng::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.escala{display:flex;justify-content:space-between;font-size:12px;color:var(--ter)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #2c2c2e}
.fila:first-of-type{border-top:0;padding-top:0}
.fila b{font-size:16px;font-weight:600}.fila small{display:block;color:var(--sec);font-size:13px}
.sw{width:52px;height:32px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px #0006}
.sw[aria-checked=true]{background:var(--verde)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}.stepper output{min-width:46px;text-align:center;font-size:20px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--card2);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
details{margin-top:10px}summary{cursor:pointer;color:var(--agua);font-size:15px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details ol,details ul{color:#d1d1d6;font-size:14px;padding-left:20px;margin:8px 0 0}details li{margin:4px 0}
.factores{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.factores span{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--card2)}

/* ---------- Rotación ---------- */
.prios{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.prios{grid-template-columns:repeat(3,1fr)}}
.plan .plan-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rango{font-size:13px;font-weight:700;color:var(--lima);text-transform:uppercase;letter-spacing:.04em}
.plan h2{padding-right:0;margin:4px 0 0;font-size:21px}
.plan-h svg{width:72px;flex:none}
.temps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.temp{background:var(--card2);border-radius:16px;padding:12px 10px;min-width:0}
.temp .emo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:25px;margin-bottom:8px}
.temp small{display:block;font-size:12px;color:var(--sec)}
.temp b{display:block;font-size:16px;line-height:1.2;margin:2px 0;overflow-wrap:anywhere}
.temp span{font-size:12px;color:#d1d1d6}
.inds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
@media(max-width:520px){.inds{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:10px}}
.ind{display:block;width:100%;border-radius:12px;padding:4px 0}
.ind svg{width:100%;max-width:52px;display:block;margin:0 auto 2px}
.ind span{font-size:11px;color:var(--sec);display:block;line-height:1.2}
.ind.pri span{color:var(--lima);font-weight:700}
.ind[aria-expanded=true]{background:var(--card2)}
.expl{background:var(--card2);border-radius:14px;padding:12px;margin-top:8px;font-size:14px;color:#d1d1d6}
.expl p{margin:0 0 6px}.expl b{color:#fff}
.porque{font-size:15px;color:#d1d1d6;margin:12px 0 0}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--lima);color:#000;font-weight:700;border-radius:999px;padding:11px 20px;font-size:16px}
.btn2{background:var(--card2);color:#fff;font-weight:600;border-radius:999px;padding:11px 18px;font-size:16px}
.nota-box{background:#ffd60a1a;color:#ffe58a;border-radius:16px;padding:12px 14px;font-size:14px}
.gantt{min-width:520px}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.g-row{display:grid;grid-template-columns:132px repeat(12,1fr);gap:2px;align-items:center;margin-bottom:5px}
.g-h span{font-size:11px;color:var(--sec);text-align:center}
.g-n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bar{height:28px;border-radius:8px}
@media(max-width:520px){.g-row{grid-template-columns:100px repeat(12,1fr)}.gantt{min-width:440px}}
.ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid #2c2c2e;font-size:15px}
.ev:first-child{border-top:0}
.ev span{flex:none;width:112px;color:var(--sec);font-size:14px}
.ev i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.tabla{width:100%;border-collapse:collapse;font-size:15px}.tabla td,.tabla th{padding:9px 6px;border-top:1px solid #2c2c2e;text-align:left}
.tabla th{font-size:12px;color:var(--sec);border-top:0;font-weight:600}

/* ---------- Impacto ---------- */
.comp{display:grid;gap:14px}
.comp-f>b{font-size:15px;display:block;margin-bottom:6px}
.barra2{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px;color:var(--sec);margin:3px 0}
.barra2 div{height:10px;border-radius:5px;background:var(--card3);overflow:hidden}
.barra2 div i{display:block;height:100%;border-radius:5px}
.barra2 em{font-style:normal;color:#fff;text-align:right;font-family:var(--num);font-weight:600}
.lista-t{margin:0;padding-left:20px;color:#d1d1d6;font-size:15px}.lista-t li{margin:6px 0}

/* ---------- Barra de pestañas flotante ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:900;width:min(620px,calc(100% - 20px));
 display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:999px;background:rgba(44,44,46,.72);
 -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid #ffffff14;box-shadow:0 10px 30px #000a}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:999px;color:#e5e5ea;font-size:11.5px;font-weight:600;white-space:nowrap}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current=page]{color:var(--lima);background:#ffffff14}

/* ---------- Pantallas de inicio ---------- */
.full{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
.carga h1{font-size:30px;margin:18px 0 4px;letter-spacing:-.02em}
.carga p{color:var(--sec);margin:0 0 22px}
.carga .rings{width:150px;margin:0 auto}
.prog{width:200px;height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:0 auto}
.prog i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--suelo),var(--agua),var(--clima));transition:width .5s}
.intro{max-width:460px;width:100%}
.intro .vis{height:190px;display:grid;place-items:center;font-size:96px;margin-bottom:10px}
.intro .vis .rings{width:180px}
.intro h2{font-size:28px;letter-spacing:-.02em;margin:0 0 10px}
.intro p{color:#d1d1d6;margin:0 0 10px}
.intro ul{text-align:left;color:var(--sec);font-size:15px;padding-left:20px}
.puntos{display:flex;gap:7px;justify-content:center;margin:20px 0}
.puntos i{width:8px;height:8px;border-radius:50%;background:var(--card3)}.puntos i.on{background:#fff;width:22px;border-radius:4px}
.intro .acciones{justify-content:center}
.sem{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}

/* ---------- Hoja inferior (informe) ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--txt);max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:#000b}

<script>
"use strict";
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MC = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const COL = {suelo:"#ff7a45", agua:"#32c8ff", clima:"#a8f04a", lluvia:"#3fb7f7", evap:"#ffd60a", temp:"#ff9f0a", hum:"#64d2ff",
             verde:"#30d158", amarillo:"#ffd60a", rojo:"#ff453a", lima:"#c6f432", morado:"#a59bf5", gris:"#8e8e93", tmin:"#5ac8fa"};

const NIVT = {nulo:"Sin riesgo", bajo:"Bajo", medio:"Medio", alto:"Alto"};

const PRI = [["agua","💧","Ahorrar agua","Cultivos que piden menos agua"],

             ["materia_organica","🍂","Materia orgánica","Tierra más viva y fértil"],
             ["mercado","🛒","Vender bien","Cultivos con salida en la zona"]];
const IND = {agua:["💧","Agua","Uso del agua"], nitrogeno:["🌱","Nitrógeno","Nitrógeno"], erosion:["⛰️","Erosión","Frena la erosión"],
             materia_organica:["🍂","Materia org.","Materia orgánica"], forraje:["🐄","Forraje","Forraje"], mercado:["🛒","Mercado","Mercado"],

const BEN = {agua:["💧","#32c8ff","Ahorra agua"], forraje:["🐄","#c6f432","Buen forraje"], nitrogeno:["🌱","#30d158","Más nitrógeno"],
             erosion:["⛰️","#ff9f0a","Frena la erosión"], materia_organica:["🍂","#d08a4c","Más materia orgánica"], mercado:["🛒","#ffd60a","Buena venta"]};
const TEMP = ["Primeras lluvias","Segundas lluvias","Verano"];
const hoy = new Date();
const FECHA = hoy.toLocaleDateString("es-CO", {weekday:"long", day:"numeric", month:"long"}).toUpperCase();
const S = {zonas:[], perfiles:[], cultivos:[], estado:{}, zona:null, punto:null, textura:"franco", perfil:null,
  suelo:{ph:6.0, n:"medio", p:"medio", k:"medio", humedad_pct:25, temp_suelo_c:29, salinidad:"normal"},
  prios:["nitrogeno","agua"], lotes:1, ultimo:"", riego:null, ha:5, anios:5, res:null, panel:null, sim:null,
  planCrono:0, planSim:0, tab:0, modoRec:"lluvia", diario:{}, mesDia:null, pins:{}, volando:false, pantalla:"carga", indAbierto:null, climaZona:null};
let mapa, capaAct = null, capaObj = null, punto = null;
const api = u => fetch(u).then(r => r.json());
const post = (u, b) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)}).then(r => r.json());
const pill = (s, t) => `<span class="pill ${s}">${t}</span>`;

/* ================= Gráficos SVG ================= */
function anillos(lista, size = 180, sw = 18, gap = 3){
  const c = size / 2; let s = `<svg viewBox="0 0 ${size} ${size}" class="rings" aria-hidden="true">`;
  lista.forEach((a, i) => {
    const r = c - sw / 2 - i * (sw + gap), C = 2 * Math.PI * r, v = Math.max(0, Math.min(100, a.v));
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${a.c}" stroke-opacity=".2" stroke-width="${sw}"/>`;
    if (v > 0) s += `<circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${a.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C * v / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;
    if (sw >= 12) { const y = c - r, k = sw * .22; s += `<path d="M${c - k} ${y}h${2 * k}M${c + k - k * .9} ${y - k * .9}l${k * .9} ${k * .9}-${k * .9} ${k * .9}" stroke="#000" stroke-width="${sw * .13}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; }
  });
  return s + "</svg>";
}
function anillo(v, color, texto, size = 72, sw = 8, emoji){
  const c = size / 2, r = c - sw / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(100, v));
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".2" stroke-width="${sw}"/>
    ${p > 0 ? `<circle class="arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>` : ""}
    ${emoji ? `<text x="${c}" y="${c + size * .11}" font-size="${size * .3}" text-anchor="middle">${emoji}</text>` :
      `<text x="${c}" y="${c + size * .11}" font-size="${size * .3}" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-rounded,-apple-system,system-ui,sans-serif">${texto}</text>`}</svg>`;
}
function miniBarras(vals, color, hl, linea, base = 0){
  const W = 160, H = 58, n = vals.length, mx = base + (Math.max(...vals, linea || 0, 1) - base) * 1.05, slot = W / n;
  let s = `<svg viewBox="0 0 ${W} ${H + 14}" class="mini" aria-hidden="true">`;
  for (let i = 0; i <= n; i++) s += `<line x1="${i * slot}" x2="${i * slot}" y1="0" y2="${H}" stroke="#48484a" stroke-width=".8" stroke-dasharray="1.2 2.6"/>`;
  vals.forEach((v, i) => { const h = Math.max(2.5, (v - base) / (mx - base) * (H - 2)); s += `<rect x="${i * slot + slot / 2 - 2.6}" y="${H - h}" width="5.2" height="${h}" rx="2.6" fill="${color}" opacity="${i === hl ? 1 : .45}"/>`; });
  if (linea) { const y = H - (linea - base) / (mx - base) * (H - 2); s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${COL.rojo}" stroke-width="1" stroke-dasharray="3 3"/>`; }
  [0, 3, 6, 9].forEach(i => s += `<text x="${i * slot + 1}" y="${H + 12}" font-size="9.5" fill="#8e8e93">${MC[i]}</text>`);
  return s + "</svg>";
}
function hexMedalla(k){
  const [e, c] = BEN[k] || ["🏅", COL.lima], pt = (r, cx = 60, cy = 60) => Array.from({length:6}, (_, i) => { const a = Math.PI / 3 * i - Math.PI / 2; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="hx-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".45"/></linearGradient>
   <linearGradient id="hm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2f7"/><stop offset="1" stop-color="#8e8e93"/></linearGradient></defs>
   <polygon points="${pt(56)}" fill="url(#hm)"/><polygon points="${pt(49)}" fill="url(#hx-${k})"/><polygon points="${pt(49)}" fill="#000" opacity=".12"/>
   <text x="60" y="73" font-size="38" text-anchor="middle">${e}</text></svg>`;
}
/* Gráficas grandes: el ancho del dibujo se ajusta al ancho real de la tarjeta para que el texto no quede diminuto */
function gw(lleno){ const w = Math.min(1080, innerWidth) - 32, dos = innerWidth < 900; return Math.max(280, Math.round((lleno || dos ? w : (w - 12) / 2) - 32)); }
function ejeMeses(W, H, pl, slot, hl){ return MC.map((m, i) => `<text x="${pl + i * slot + slot / 2}" y="${H - 6}" font-size="11.5" text-anchor="middle" fill="${i === hl ? "#fff" : "#8e8e93"}" font-weight="${i === hl ? 700 : 400}">${m}</text>`).join(""); }
function graficoBalance(C){
  const W = gw(true), H = 230, pl = 34, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb, slot = iw / 12, hl = C.mes_actual - 1;
  const mx = Math.max(...C.serie.map(x => Math.max(x.lluvia, x.evap)), 50) * 1.08, Y = v => pt + ih * (1 - v / mx);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Lluvia y evaporación de cada mes">`;
  [0, .5, 1].forEach(f => s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(mx / 1.08 * f)}" y2="${Y(mx / 1.08 * f)}" stroke="#2c2c2e"/><text x="${pl - 6}" y="${Y(mx / 1.08 * f) + 4}" font-size="10.5" fill="#8e8e93" text-anchor="end">${Math.round(mx / 1.08 * f)}</text>`);
  C.serie.forEach((x, i) => {
    if (x.balance < 0) s += `<rect x="${pl + i * slot + 2}" y="${pt + ih + 3}" width="${slot - 4}" height="4" rx="2" fill="${COL.rojo}" opacity=".85"/>`;
    s += `<rect x="${pl + i * slot + slot * .22}" y="${Y(x.lluvia)}" width="${slot * .56}" height="${pt + ih - Y(x.lluvia)}" rx="5" fill="${COL.lluvia}" opacity="${i === hl ? 1 : .75}"/>`;
  });
  const pts = C.serie.map((x, i) => `${pl + i * slot + slot / 2},${Y(x.evap)}`);
  s += `<polyline points="${pts.join(" ")}" fill="none" stroke="${COL.evap}" stroke-width="3" stroke-linejoin="round"/>` + C.serie.map((x, i) => `<circle cx="${pl + i * slot + slot / 2}" cy="${Y(x.evap)}" r="3.5" fill="${COL.evap}"/>`).join("");
  s += ejeMeses(W, H, pl, slot, hl);
  C.serie.forEach((x, i) => s += `<rect class="hit" data-mes="${i + 1}" x="${pl + i * slot}" y="${pt}" width="${slot}" height="${ih + 26}" fill="transparent"><title>${MC[i]}: lluvia ${x.lluvia} mm, evaporación ${x.evap} mm</title></rect>`);
  return s + "</svg>";
}
function graficoDias(d){
  const W = gw(true) - 24, H = 150, pl = 30, pr = 6, pt = 10, pb = 22, iw = W - pl - pr, ih = H - pt - pb, n = d.dias.length, bw = iw / n, mx = Math.max(...d.dias.map(x => x.lluvia_mm), 5);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Lluvia por día">`;
  d.dias.forEach((x, i) => { const h = Math.max(x.lluvia_mm ? 2 : 0, x.lluvia_mm / mx * ih); s += `<rect x="${pl + i * bw + 1.5}" y="${pt + ih - h}" width="${Math.max(bw - 3, 1)}" height="${h}" rx="2" fill="${COL.lluvia}"/>`;
    if (x.dia === 1 || x.dia % 5 === 0) s += `<text x="${pl + i * bw + bw / 2}" y="${H - 5}" font-size="10.5" fill="#8e8e93" text-anchor="middle">${x.dia}</text>`; });
  s += `<text x="${pl - 6}" y="${pt + 8}" font-size="10" fill="#8e8e93" text-anchor="end">${Math.round(mx)}</text><text x="${pl - 6}" y="${pt + ih}" font-size="10" fill="#8e8e93" text-anchor="end">0</text>`;
  return s + "</svg>";
}
function graficoTemp(C){
  const W = gw(false), H = 230, pl = 34, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb, slot = iw / 12, hl = C.mes_actual - 1;
  const lo = Math.floor(Math.min(...C.serie.map(x => x.tmin)) - 2), hi = Math.ceil(Math.max(36, ...C.serie.map(x => x.tmax)) + 1), Y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Temperatura máxima, media y mínima de cada mes">`;
  [lo, Math.round((lo + hi) / 2), hi].forEach(v => s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c2c2e"/><text x="${pl - 6}" y="${Y(v) + 4}" font-size="10.5" fill="#8e8e93" text-anchor="end">${v}°</text>`);
  s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(35)}" y2="${Y(35)}" stroke="${COL.rojo}" stroke-dasharray="5 4"/><text x="${W - pr}" y="${Y(35) - 5}" font-size="10.5" fill="${COL.rojo}" text-anchor="end">35 °C: estrés por calor</text>`;
  [["tmax", COL.temp], ["tmed", COL.evap], ["tmin", COL.tmin]].forEach(([k, c]) => {
    s += `<polyline points="${C.serie.map((x, i) => `${pl + i * slot + slot / 2},${Y(x[k])}`).join(" ")}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
    s += C.serie.map((x, i) => `<circle cx="${pl + i * slot + slot / 2}" cy="${Y(x[k])}" r="${i === hl ? 5 : 3}" fill="${c}"/>`).join("");
  });
  return s + ejeMeses(W, H, pl, slot, hl) + "</svg>";
}
function graficoNdvi(rec){
  const W = gw(false), H = 210, pl = 34, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb, slot = iw / rec.length, Y = v => pt + ih * (1 - v / .9);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Verdor de los últimos 6 meses frente a lo normal">`;
  [0, .3, .6, .9].forEach(v => s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c2c2e"/><text x="${pl - 6}" y="${Y(v) + 4}" font-size="10.5" fill="#8e8e93" text-anchor="end">${N(v, 1)}</text>`);
  rec.forEach((x, i) => { const bajo = x.ndvi < x.ndvi_normal * .9;
    s += `<rect x="${pl + i * slot + slot * .25}" y="${Y(x.ndvi)}" width="${slot * .5}" height="${pt + ih - Y(x.ndvi)}" rx="6" fill="${bajo ? COL.amarillo : COL.verde}"/>`;
    s += `<line x1="${pl + i * slot + slot * .15}" x2="${pl + i * slot + slot * .85}" y1="${Y(x.ndvi_normal)}" y2="${Y(x.ndvi_normal)}" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 3"/>`;
    s += `<text x="${pl + i * slot + slot / 2}" y="${H - 6}" font-size="11.5" fill="#8e8e93" text-anchor="middle">${x.nombre}</text>`; });
  return s + "</svg>";
}
function graficoRec(r, m){
  const W = gw(false), H = 210, pl = 36, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb, slot = iw / r.length;
  const v = r.map(x => m === "lluvia" ? x.lluvia_mm : x.temp_c), nv = r.map(x => m === "lluvia" ? x.lluvia_normal_mm : x.temp_normal_c);
  const all = [...v, ...nv], mx = Math.max(...all) * 1.08, mn = m === "lluvia" ? 0 : Math.min(...all) - 1, Y = x => pt + ih * (1 - (x - mn) / (mx - mn)), c = m === "lluvia" ? COL.lluvia : COL.temp;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Últimos 6 meses frente a lo normal">`;
  [mn, mx / 1.08].forEach(x => s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(x)}" y2="${Y(x)}" stroke="#2c2c2e"/><text x="${pl - 6}" y="${Y(x) + 4}" font-size="10.5" fill="#8e8e93" text-anchor="end">${Math.round(x)}</text>`);
  if (m === "lluvia") r.forEach((x, i) => s += `<rect x="${pl + i * slot + slot * .25}" y="${Y(v[i])}" width="${slot * .5}" height="${pt + ih - Y(v[i])}" rx="6" fill="${c}"/>`);
  else s += `<polyline fill="none" stroke="${c}" stroke-width="3" points="${v.map((x, i) => `${pl + i * slot + slot / 2},${Y(x)}`).join(" ")}"/>` + v.map((x, i) => `<circle cx="${pl + i * slot + slot / 2}" cy="${Y(x)}" r="4.5" fill="${c}"/>`).join("");
  s += `<polyline fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="6 4" points="${nv.map((x, i) => `${pl + i * slot + slot / 2},${Y(x)}`).join(" ")}"/>`;
  r.forEach((x, i) => s += `<text x="${pl + i * slot + slot / 2}" y="${H - 6}" font-size="11.5" fill="#8e8e93" text-anchor="middle">${x.nombre}</text>`);
  return s + "</svg>";
}
function lineasN(s){
  const W = gw(false), H = 210, pl = 34, pr = 10, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = s.proyeccion.anios.length, X = i => pl + i * iw / Math.max(1, n - 1), Y = v => pt + ih * (1 - v / 100);

function hav(a, b, c, d){ const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); }

   <div class="temps">${p.secuencia.map(x => `<div class="temp" style="grid-column:span ${x.ocupa}"><div class="emo" style="background:${TIPOC[x.tipo]}26">${x.icono}</div><small>${x.temporada}</small><b>${x.nombre}</b><span>${x.cosecha ? cap(x.siembra.slice(0, 3)) + " → " + cap(x.cosecha.slice(0, 3)) : "Desde " + x.siembra}</span></div>`).join("")}</div>
   <div class="inds">${Object.entries(p.indicadores).map(([k, v]) => `<button type="button" class="ind ${r.prioridades.includes(k) ? "pri" : ""}" data-ind="${i}:${k}" aria-expanded="${ab === k}" aria-label="${IND[k][2]}: ${v.valor} de 100">${anillo(v.valor, SEMC[v.semaforo], v.valor, 52, 6)}<span>${IND[k][0]} ${IND[k][1]}</span></button>`).join("")}</div>
   ${ab ? `<div class="expl"><b>${IND[ab][2]}: ${p.indicadores[ab].valor} de 100</b> <span class="sub">(pesa ${Math.round(r.pesos[ab] * 100)}%)</span>${p.indicadores[ab].explicacion.map(t => `<p>${t}</p>`).join("")}</div>` : ""}
   <p class="porque">💬 ${p.secuencia[0].por_que}</p>
   <div class="acciones"><button type="button" class="btn" data-inf="${i}">Ver detalle</button>${VOZ ? `<button type="button" class="btn2" data-voz="plan${i}">🔊 Escuchar</button>` : ""}<button type="button" class="btn2" data-sim="${i}">Ver impacto</button></div></article>`;
}
function ganttHtml(c){
  return `<div class="scroll"><div class="gantt"><div class="g-row g-h"><span></span>${c.gantt.meses.map(m => `<span>${m}</span>`).join("")}</div>
   ${c.gantt.filas.map(f => `<div class="g-row"><span class="g-n">${f.icono} ${f.nombre}</span><div class="g-bar" style="grid-column:${f.inicio + 2} / span ${Math.min(f.largo, 12 - f.inicio)};background:${TIPOC[f.tipo]}" title="${f.nombre}"></div></div>`).join("")}</div></div>`;
}
const EVC = {siembra:COL.verde, cosecha:COL.amarillo, cambio:COL.morado, cobertura:"#a2845e"};
const eventosHtml = c => `<div>${c.eventos.map(e => `<div class="ev"><i style="background:${EVC[e.tipo]}"></i><span>${cap(e.mes)}</span><div>${e.texto}</div></div>`).join("")}</div>`;
$("#v3").addEventListener("click", e => {
  const pr = e.target.closest("[data-pri]");
  if (pr) { const v = pr.dataset.pri, a = S.prios; S.prios = a.includes(v) ? (a.length > 1 ? a.filter(x => x !== v) : a) : (a.length >= 3 ? [...a.slice(1), v] : [...a, v]); S.indAbierto = null;
    $$("#v3 [data-pri]").forEach(b => b.setAttribute("aria-pressed", S.prios.includes(b.dataset.pri))); actualizar(); return; }
  const ind = e.target.closest("[data-ind]");
  if (ind) { const [i, k] = ind.dataset.ind.split(":"); S.indAbierto = S.indAbierto && S.indAbierto[0] === +i && S.indAbierto[1] === k ? null : [+i, k]; renderRot(); return; }
  const c = e.target.closest("#tog-crono [data-p]"); if (c) { S.planCrono = +c.dataset.p; renderRot(); return; }
  const inf = e.target.closest("[data-inf]"); if (inf) { abrirInforme(+inf.dataset.inf); return; }
  const sim = e.target.closest("[data-sim]"); if (sim) { S.planSim = +sim.dataset.sim; S.sim = null; ir(4); }
});

/* Informe en hoja inferior */
function abrirInforme(i){
  const r = S.res, p = r.planes[i], f = p.informe, NV = {bajo:"rojo", medio:"amarillo", alto:"verde"};
  const ranking = i === 0 ? `Es la opción con mayor puntaje según lo que elegiste.` : `Quedó ${r.planes[0].puntaje - p.puntaje} puntos por debajo de la mejor opción.`;
  const lista = (t, xs) => `<section class="card"><h2>${t}</h2><ul class="lista-t">${xs.map(x => `<li>${x}</li>`).join("")}</ul></section>`;
  $("#hoja").innerHTML = `<button class="x" id="cerrar" aria-label="Cerrar">✕</button><div class="agarre"></div>
   <span class="rango">${RANGO[i]}</span><h2>${p.secuencia.map(x => x.icono).join(" ")} ${p.secuencia.map(x => x.nombre).join(" → ")}</h2>
   <p class="sub">${p.puntaje} de 100 · ${ranking}</p>
   <section class="card"><h2>Temporada por temporada</h2><table class="tabla"><tr><th>Cultivo</th><th>Lluvia esperada</th><th>Agua que pide</th><th>Cubierto</th></tr>
     ${f.temporadas.map(t => `<tr><td>${t.icono} <b>${t.cultivo}</b><br><span class="sub">${t.temporada} · ${t.cosecha ? cap(t.siembra) + " a " + t.cosecha : "desde " + t.siembra}</span></td><td class="n">${t.lluvia_mm} mm</td><td class="n">${t.agua_mm ? t.agua_mm + " mm" : "No pide"}</td><td class="n">${t.agua_mm ? t.cubierto_pct + "%" : "—"}</td></tr>`).join("")}</table>
     <p class="sub" style="margin-top:10px">Nitrógeno del suelo: ${f.nitrogeno.map(x => `<b class="${NV[x]}">${cap(x)}</b>`).join(" → ")}</p></section>
   <section class="card"><h2>¿Por qué estos puntajes?</h2>${Object.entries(p.indicadores).map(([k, v]) => `<div class="alerta"><div style="width:46px;flex:none">${anillo(v.valor, SEMC[v.semaforo], v.valor, 46, 5)}</div><div><b>${IND[k][0]} ${IND[k][2]}</b>${v.explicacion.map(t => `<p>${t}</p>`).join("")}</div></div>`).join("")}</section>
   <section class="card"><h2>Calendario</h2>${ganttHtml(f.cronograma)}${eventosHtml(f.cronograma)}</section>
   ${lista("Riesgos a vigilar", f.riesgos)}${lista("Cuidados sugeridos", f.cuidados)}${lista("Reglas aplicadas", f.reglas)}${lista("Supuestos y límites", f.supuestos)}
   <div class="acciones"><button class="btn" id="a-imp">Ver el impacto de esta opción</button>${VOZ ? `<button class="btn2" data-voz="plan${i}">🔊 Escuchar</button>` : ""}</div>`;
  $("#hoja-d").showModal(); $("#hoja").scrollTop = 0;
  $("#cerrar").onclick = () => $("#hoja-d").close();
  $("#a-imp").onclick = () => { S.planSim = i; S.sim = null; $("#hoja-d").close(); ir(4); };
}
$("#hoja-d").addEventListener("click", e => { if (e.target === $("#hoja-d")) $("#hoja-d").close(); });
$("#hoja-d").addEventListener("close", () => VOZ && speechSynthesis.cancel());

/* ================= 4. Impacto ================= */
async function renderImp(){
  const r = S.res, el = $("#v4");
  if (!r || !r.planes.length) { el.innerHTML = cabecera("Impacto") + `<div class="card">Primero necesitamos una recomendación. Revisa Mi lote o Rotación.</div>`; return; }
  const anim = S.animar;
  el.innerHTML = cabecera("Impacto", "Qué pasaría en tu lote con la rotación, frente a seguir sembrando lo mismo.") + `<div class="grid"><section class="card c4" id="imp-ctl"></section></div><div id="imp-res"></div>`;
  $("#imp-ctl").innerHTML = `<h2>Opción a evaluar</h2><div class="tog" id="tog-sim">${r.planes.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${i === S.planSim}">Opción ${i + 1}</button>`).join("")}</div>
    <p class="sub" style="margin:4px 0 6px">${r.planes[S.planSim].secuencia.map(x => x.icono + " " + x.nombre).join(" → ")}</p>
    <div class="fila" style="border-top:1px solid #2c2c2e;padding-top:12px"><div><b>Hectáreas</b></div><div class="stepper"><button type="button" data-ha="-0.5" aria-label="Menos hectáreas">−</button><output class="n">${N(S.ha, 1)}</output><button type="button" data-ha="0.5" aria-label="Más hectáreas">+</button></div></div>
    <div class="fila" style="display:block"><div style="display:flex;justify-content:space-between"><b>Años a proyectar</b><b class="n" id="o-anios">${S.anios}</b></div><input class="rng" type="range" id="i-anios" min="1" max="10" value="${S.anios}" aria-label="Años a proyectar" style="--track:linear-gradient(90deg,${COL.lima} ${(S.anios - 1) / 9 * 100}%,#3a3a3c ${(S.anios - 1) / 9 * 100}%)"></div>`;
  calcularImp(anim);
}
async function calcularImp(anim){
  const r = S.res, mi = ++renderImp.t, p = r.planes[S.planSim];
  if (!S.sim) {
    $("#imp-res").innerHTML = '<p class="sub" style="margin:14px 4px">Calculando…</p>';
    const s = await post("/api/simular", {zona_id:S.zona.id, suelo:S.suelo, textura:S.textura, riego:S.riego, secuencia:p.secuencia.map(x => x.cultivo), ultimo_cultivo:S.ultimo, ha:S.ha, anios:S.anios});
    if (mi !== renderImp.t) return; S.sim = s;
  }
  pintarImp(S.sim, anim);
}
renderImp.t = 0;
function pintarImp(s, anim){
  const a = s.ahorro, P = s.plan.indices, B = s.base.indices, d = P.total - B.total, sd = x => x >= 70 ? "verde" : x >= 45 ? "amarillo" : "rojo";
  const nf = v => v < 35 ? ["Bajo", "rojo"] : v < 65 ? ["Medio", "amarillo"] : ["Alto", "verde"], nP = nf(s.plan.n_serie.at(-1)), nB = nf(s.base.n_serie.at(-1));
  const par = (t, k) => `<div class="comp-f"><b>${t}</b><div class="barra2"><span>Sin rotar</span><div><i style="width:${B[k]}%;background:${COL.gris}"></i></div><em>${B[k]}</em></div>
    <div class="barra2"><span>Con rotación</span><div><i style="width:${P[k]}%;background:${SEMC[sd(P[k])]}"></i></div><em>${P[k]}</em></div></div>`;
  $("#imp-res").innerHTML = `<div class="grid ${anim ? "anim" : ""}" style="margin-top:12px">
   <section class="card c2 ${anim ? "dibuja" : ""}"><h2>Resiliencia climática</h2><div class="estado-in">${anillos([{v:P.total, c:COL.clima}, {v:B.total, c:COL.gris}], 150, 18, 4)}
     <div class="ley-an"><div><span>Con la rotación</span><b class="n" style="color:${COL.clima}">${P.total}<small>/100</small></b></div><div><span>Sin rotar</span><b class="n" style="color:${COL.gris}">${B.total}<small>/100</small></b></div>
      <div><span>Diferencia</span><b class="n ${d >= 0 ? "verde" : "rojo"}">${d >= 0 ? "+" : ""}${d}</b></div></div></div></section>
   <section class="card"><h2>Agua de riego</h2><span class="lbl">${a.m3_total >= 0 ? "Te ahorras al año" : "Necesitas de más al año"}</span>
     <span class="big n" style="color:${a.m3_total >= 0 ? COL.lluvia : COL.rojo}">${N(Math.abs(a.m3_total))}<small>m³</small></span><span class="sub">${N(Math.abs(a.m3_ha))} m³ por hectárea en tus ${N(s.ha, 1)} ha</span></section>
   <section class="card"><h2>Nitrógeno</h2><span class="lbl">En ${s.anios} ${s.anios === 1 ? "año" : "años"}</span>
     <span class="big ${nP[1]}" style="font-weight:700">${nP[0]}</span><span class="sub">Sin rotar quedaría ${nB[0].toLowerCase()}</span></section>
   <section class="card"><h2>Déficit de agua</h2><span class="lbl">Lo que la lluvia no cubre</span><span class="mid n" style="margin-top:4px">${s.base.deficit_mm} → <span style="color:${COL.lluvia}">${s.plan.deficit_mm}</span><small>mm</small></span>
     <span class="sub">${a.pct_deficit ? (a.pct_deficit > 0 ? "−" : "+") + Math.abs(a.pct_deficit) + "% frente a sin rotar" : "Igual que sin rotar"}</span></section>
   <section class="card"><h2>Suelo cubierto</h2><span class="lbl">Parte del año</span><span class="mid n" style="margin-top:4px">${s.base.cobertura_pct}% → <span style="color:${COL.clima}">${s.plan.cobertura_pct}%</span></span><span class="sub">Menos erosión y más materia orgánica</span></section>
   <section class="card c2"><h2>Frente a sembrar lo mismo</h2><div class="comp">${par("🌱 Retención de nutrientes", "retencion")}${par("🌵 Resistencia a la sequía", "sequia")}${par("🌧️ Resistencia a lluvias fuertes", "lluvias")}</div>
     <p class="sub" style="margin-top:12px">Sin rotar: ${s.base.nombre}.</p></section>
   <section class="card c2"><h2>Agua ahorrada acumulada</h2><p class="sub">Metros cúbicos, año por año.</p>${barrasAgua(s)}</section>
   <section class="card c2"><h2>Nitrógeno del suelo</h2><p class="sub">De 0 a 100, año por año.</p>${lineasN(s)}<div class="ley"><span><i class="l" style="background:${COL.verde}"></i>Con la rotación</span><span><i class="l" style="background:${COL.gris}"></i>Sin rotar</span></div></section>
   <section class="card c4"><h2>En resumen</h2><ul class="lista-t">${s.mensajes.map(m => `<li>${m}</li>`).join("")}</ul>
     <details><summary>Supuestos de esta simulación</summary><ul>${s.supuestos.map(m => `<li>${m}</li>`).join("")}</ul></details></section></div>`;
}
$("#v4").addEventListener("click", e => {
  const b = e.target.closest("#tog-sim [data-p]"); if (b) { S.planSim = +b.dataset.p; S.sim = null; renderImp(); return; }
  const h = e.target.closest("[data-ha]"); if (h) { S.ha = Math.max(.5, Math.min(500, S.ha + +h.dataset.ha)); S.sim = null; renderImp(); }
});
$("#v4").addEventListener("input", e => {
  if (e.target.id !== "i-anios") return;
  S.anios = +e.target.value; $("#o-anios").textContent = S.anios;
  const q = (S.anios - 1) / 9 * 100; e.target.style.setProperty("--track", `linear-gradient(90deg,${COL.lima} ${q}%,#3a3a3c ${q}%)`);
  clearTimeout(renderImp.d); renderImp.d = setTimeout(() => { S.sim = null; calcularImp(false); }, 250);
});

let anchoPrevio = innerWidth, esperaAncho;
addEventListener("resize", () => { clearTimeout(esperaAncho); esperaAncho = setTimeout(() => {
  if (Math.abs(innerWidth - anchoPrevio) < 60 || S.pantalla !== "app" || S.tab === 2) return;
  anchoPrevio = innerWidth; if (S.tab === 4 && S.sim) pintarImp(S.sim, false); else RENDER[S.tab]();
}, 300); });
arrancar();
</script>
</body>
</html>
