# Render (https://render.com): despliegue de AgroStake como servicio web.
# Si ya creaste el servicio a mano, no hace falta este archivo: basta con poner en Settings → Start Command:
#     gunicorn -c gunicorn.conf.py app:app
services:
  - type: web
    name: agrostake
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /salud
    envVars:
      - key: ROTACION_SECRET        # firma de las sesiones; así no se cierran solas cada vez que el servicio reinicia
        generateValue: true
      - key: DATABASE_URL           # base Postgres para las cuentas (Neon, Supabase o Render); Render la pide al crear
        sync: false
      # Códigos por correo y SMS (versión 16). Opcionales: sin ellas la cuenta se crea sin código.
      - key: BREVO_API_KEY          # correo por la API de Brevo (Render gratis bloquea SMTP)
        sync: false
      - key: CORREO_REMITENTE       # el correo que verificaste como remitente en Brevo
        sync: false
      - key: TWILIO_ACCOUNT_SID     # SMS para recuperar la cuenta (cada mensaje tiene costo)
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM            # número de Twilio que envía, con +
        sync: false
